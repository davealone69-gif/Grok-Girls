name: Build Grok Girls Android

on:
  push:
    branches: [main, renderer/native-engine]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  web:
    name: Web build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Dependency pin guard
        run: |
          if grep -q '"latest"' package.json; then
            echo "::error::package.json contains \"latest\" — pin exact versions (R4)"
            exit 1
          fi
          echo "all dependency ranges are pinned"
      - name: TypeScript/Vite build
        run: npm run build
      - name: Upload web dist
        uses: actions/upload-artifact@v4
        with:
          name: grok-girls-web
          path: dist
          if-no-files-found: error

  tests:
    name: Browser test suites
    runs-on: ubuntu-latest
    needs: web
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Playwright + Chromium
        run: |
          python -m pip install --upgrade pip
          pip install playwright
          playwright install --with-deps chromium
      - name: Build web app
        run: npm run build
      - name: Run audit + stress suites
        run: |
          set -e
          python3 -m http.server 8080 --directory dist > /tmp/http.log 2>&1 &
          python3 tests/mocks/mock_big_a1111.py > /tmp/mock7860.log 2>&1 &
          python3 tests/mocks/mock_slow_a1111.py > /tmp/mock7861.log 2>&1 &
          SERVERS=$!
          for p in 8080 7860 7861; do
            for i in $(seq 1 30); do
              (exec 3<>/dev/tcp/127.0.0.1/$p) 2>/dev/null && break
              sleep 1
            done
            (exec 3<>/dev/tcp/127.0.0.1/$p) 2>/dev/null || { echo "port $p never came up"; kill $SERVERS 2>/dev/null; exit 1; }
          done
          echo "all servers up"
          python3 tests/ci_runner.py
          RC=$?
          kill $(jobs -p) 2>/dev/null || true
          exit $RC
      - name: Dependency security gate
        run: npm audit --audit-level=high

  android:
    name: Android APK
    runs-on: ubuntu-latest
    needs: web
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android SDK packages
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Build web app
        run: npm run build
      - name: Sync Capacitor Android
        run: npx cap sync android
      - name: Make Gradle executable
        run: chmod +x android/gradlew
      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon --stacktrace
      - name: Verify APK exists
        run: test -s android/app/build/outputs/apk/debug/app-debug.apk
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: grok-girls-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
      - name: Decode release keystore
        env:
          RELEASE_KEYSTORE: ${{ secrets.RELEASE_KEYSTORE }}
        run: |
          if [ -n "$RELEASE_KEYSTORE" ]; then
            mkdir -p android/keystore
            echo "$RELEASE_KEYSTORE" | base64 -d > android/keystore/grok-girls-release.jks
            echo "release keystore decoded"
          else
            echo "RELEASE_KEYSTORE secret not set — release APK skipped"
          fi
      - name: Build release APK
        working-directory: android
        env:
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          if [ -f keystore/grok-girls-release.jks ]; then
            ./gradlew assembleRelease --no-daemon --stacktrace
          else
            echo "no release keystore — skipping assembleRelease"
          fi
      - name: Verify release APK
        run: |
          APK=android/app/build/outputs/apk/release/app-release.apk
          if [ -s "$APK" ]; then
            echo "release APK built: $(stat -c%s "$APK") bytes"
          elif [ -f android/keystore/grok-girls-release.jks ]; then
            echo "ERROR: keystore present but release APK was not produced" && exit 1
          else
            echo "release APK not produced (no keystore configured)"
          fi
      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: grok-girls-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: warn
          retention-days: 30
