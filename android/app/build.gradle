apply plugin: 'com.android.application'
apply plugin: 'org.jetbrains.kotlin.android'

android {
    namespace "ai.grokgirls.studio"
    compileSdk rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "ai.grokgirls.studio"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 15
        versionName "1.5.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }
    kotlinOptions {
        jvmTarget = '21'
    }
    // Native avatar engine (Kotlin/GLES3) lives at repo root in native/ —
    // compile it straight into the app, single source of truth (no copies).
    sourceSets {
        main.java.srcDirs += ['../../native/app/src/main/java/com/aura/avatarstudio/renderer']
    }
    signingConfigs {
        def ks = rootProject.file('keystore/grok-girls-release.jks')
        if (ks.exists()) {
            release {
                storeFile ks
                storePassword project.findProperty('RELEASE_STORE_PASSWORD') ?: System.getenv('RELEASE_STORE_PASSWORD')
                keyAlias project.findProperty('RELEASE_KEY_ALIAS') ?: System.getenv('RELEASE_KEY_ALIAS')
                keyPassword project.findProperty('RELEASE_KEY_PASSWORD') ?: System.getenv('RELEASE_KEY_PASSWORD')
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            // Sign with the release keystore when it exists (CI decodes it
            // from the RELEASE_KEYSTORE secret); otherwise fall back to an
            // unsigned build (never ships).
            if (rootProject.file('keystore/grok-girls-release.jks').exists()) {
                signingConfig signingConfigs.release
            }
        }
    }
}

// Fix duplicate-class conflicts: old kotlin-stdlib-jdk7/jdk8 1.6.x jars are pulled
// transitively and clash with kotlin-stdlib 1.8.x. Force one consistent version.
configurations.configureEach {
    resolutionStrategy {
        force 'org.jetbrains.kotlin:kotlin-stdlib:1.8.22'
        force 'org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.8.22'
        force 'org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.22'
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    androidTestImplementation "androidx.test.uiautomator:uiautomator:$androidxUiAutomatorVersion"
    androidTestImplementation "androidx.test:runner:$androidxTestRunnerVersion"
    androidTestImplementation "androidx.test:rules:$androidxTestRulesVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

tasks.register('stage3dddAvatarAssets', Copy) {
    from("${rootProject.projectDir.parentFile.parentFile}/public/vendor/3DDD/app/src/main/assets/models")
    into("${projectDir}/src/main/assets/models")
}

preBuild.dependsOn(stage3dddAvatarAssets)

apply from: 'capacitor.build.gradle'

// capacitor.build.gradle is GENERATED by `cap sync`/`cap update` and is
// applied AFTER our android{} block above. Capacitor 8 requires Java 21,
// so we match it here (Java and Kotlin targets must stay consistent, and
// :capacitor-android itself compiles at 21).
android {
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }
}

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
