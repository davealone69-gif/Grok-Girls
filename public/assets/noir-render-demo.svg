      <stop offset="0%" stop-color="#120a10"/>
      <stop offset="55%" stop-color="#2b0d16"/>
      <stop offset="100%" stop-color="#050508"/>
    </linearGradient>
    <radialGradient id="keyLight" cx="42%" cy="30%" r="55%">
      <stop offset="0%" stop-color="#E62040" stop-opacity="0.4"/>
      <stop offset="60%" stop-color="#E62040" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    
    <linearGradient id="skinGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e9c3ae"/>
      <stop offset="85%" stop-color="#e9c3ae"/>
      <stop offset="100%" stop-color="#E62040" stop-opacity="0.55"/>
    </linearGradient>
    
  <pattern id="fishnet" width="9" height="9" patternUnits="userSpaceOnUse">
    <path d="M0 0 L9 9 M9 0 L0 9" stroke="#0c0c14" stroke-width="1.1" opacity="0.75"/>
    <path d="M0 4.5 L9 4.5 M4.5 0 L4.5 9" stroke="#0c0c14" stroke-width="0.5" opacity="0.5"/>
  </pattern>
    
    <filter id="grainF">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" seed="610"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.07"/></feComponentTransfer>
      <feComposite operator="over" in2="SourceGraphic"/>
    </filter>
    
    <radialGradient id="vignette" cx="50%" cy="45%" r="70%">
      <stop offset="55%" stop-color="#000000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.85"/>
    </radialGradient>
    <filter id="rimGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="6"/>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softGlow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="26"/>
    </filter>
  </defs>

